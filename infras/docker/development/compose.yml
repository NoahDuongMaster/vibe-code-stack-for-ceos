services:
  dapp:
    image: vibe-dapp:development
    build:
      args:
        NEXT_PUBLIC_PROJECT_NAME: ${NEXT_PUBLIC_PROJECT_NAME:-vibe-code-stack-for-ceos}
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-http://localhost:3000}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3001}
        NEXT_PUBLIC_CORS_COOKIE: ${NEXT_PUBLIC_CORS_COOKIE:-localhost}
    ports:
      - '3001:3000'
    env_file:
      - ../../apps/dapp/.env.sample
