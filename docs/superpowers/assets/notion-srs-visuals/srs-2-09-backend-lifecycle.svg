<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">MCN roster, RBAC &amp; phân chia doanh thu</title><desc id="diagram-desc">CN-066–CN-072. Onboarding MCN, tư cách thành viên có consent, RBAC hiệu lực, phân công chiến dịch, báo cáo, phân chia doanh thu, quyết toán, thông báo và audit.. Các nút: CN-066 Đơn đăng ký MCN: Đơn đăng ký MCN ghi định danh agency, thẩm quyền, điều khoản và trạng thái xét duyệt.; trạng thái Mới; CN-067 Tư cách thành viên: Lời mời roster/tư cách thành viên yêu cầu Creator chấp nhận và có ngày hiệu lực.; trạng thái Mới; CN-069 Phân quyền RBAC: RBAC mở rộng primitive vai trò hiện có bằng phạm vi roster và tài chính.; trạng thái Mở rộng; CN-068 Phân công: Phân công tham chiếu tư cách thành viên active, phạm vi vai trò, chiến dịch và thời gian.; trạng thái Mới; CN-070–071 Báo cáo doanh thu: Báo cáo và phân chia dùng phiên bản phân chia doanh thu bất biến cho từng dòng thu nhập.; trạng thái Mới; Thu hồi thành viên an toàn: Thu hồi hoặc khiếu nại an toàn cập nhật quyền hiệu lực mà không xóa phân công lịch sử.; trạng thái Mở rộng; CN-072 Quyết toán: Quyết toán/thông báo/audit liên kết phiên bản phân chia, số tiền, người nhận, trạng thái và tham chiếu.; trạng thái Mở rộng. Các quan hệ: L1: agency đã được duyệt; L2: thành viên đã chấp nhận; L3: phạm vi đã cấp quyền; A1: kết quả chiến dịch; ①: rời hoặc thu hồi; L4: quyết toán phân chia; E1: bằng chứng truy cập; E2: bằng chứng thay đổi.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1400" height="1800" fill="#FFFFFF"/><text x="48" y="56" text-anchor="start" font-size="46" font-weight="800" fill="#26303B">MCN roster, RBAC &amp; phân chia doanh thu</text><text x="48" y="94" text-anchor="start" font-size="30" fill="#26303B">CN-066–CN-072</text><text x="48" 