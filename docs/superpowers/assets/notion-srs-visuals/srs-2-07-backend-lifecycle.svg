<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">PPS người bán, tỷ lệ &amp; liên hệ Creator</title><desc id="diagram-desc">CN-053–CN-056. Người bán tham gia PPS, quản lý phiên bản tỷ lệ sản phẩm, khám phá Creator, liên hệ theo consent, thu hồi, hết hạn và audit.. Các nút: CN-053 Điều khoản PPS: Điều kiện PPS/điều khoản liên kết người bán, chấp nhận cấp vốn và phiên bản chương trình hiệu lực.; trạng thái Mới; Tham gia chương trình: Việc tham gia ghi điều khoản đã chấp nhận, tác nhân, thời điểm hiệu lực và trạng thái hiện tại.; trạng thái Mới; CN-054 Tỷ lệ: Phiên bản sản phẩm/tỷ lệ mở rộng catalog hiện có mà không ghi đè sự thật sản phẩm.; trạng thái Mở rộng; CN-055 Khám phá Creator: Khám phá Creator/chat dùng dữ liệu hồ sơ an toàn theo quyền và nhắn tin nội bộ.; trạng thái Mở rộng; CN-056 Đồng ý liên hệ: Đồng ý liên hệ nêu rõ mục đích, phạm vi, quyền cấp, thời hạn hết hạn và trạng thái.; trạng thái Mới; Thu hồi consent an toàn: Thu hồi/hết hạn an toàn ẩn liên hệ ngoài nền tảng nhưng giữ chat được phép và audit.; trạng thái Mới; Audit đồng ý liên hệ: Audit giữ điều khoản, phiên bản tỷ lệ, mục đích truy cập, kết quả consent và tham chiếu thu hồi.; trạng thái Hiện có. Các quan hệ: L1: chấp nhận điều khoản; L2: chương trình active; L3: tỷ lệ đã công bố; ①: yêu cầu liên hệ; ②: consent đã thu hồi; E1: bằng chứng consent; E2: bằng chứng thu hồi.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1400" height="1800" fill="#FFFFFF"/><text x="48" y="56" text-anchor="start" font-size="46" font-weight="800" fill="#26303B">PPS người bán, tỷ lệ &amp; liên hệ Creator</text><text x="48" y="94" text-anchor="start" font-size="30" fill="#26303B">CN-053–CN-056</text><text x="48" y="128" text-anchor="start" font-size="24" fill="#56616F"><tspan x="48" dy="0">Người bán tham gia PPS, quản lý phiên bản tỷ lệ sản phẩm, khám phá Creator, liên hệ theo consent, thu hồi, hết hạn và </tspan><tspan x="48" dy="30">audit.</tspan></text><g data-band-index="0"><rect x="48" y="155" width="1304" height="690" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/></g>
