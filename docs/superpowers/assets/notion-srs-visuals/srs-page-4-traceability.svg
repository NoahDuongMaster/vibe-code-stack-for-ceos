<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Requirement traceability chain</title><desc id="diagram-desc">SP → CN → QT → MH/non-UI → KT → evidence. Observable outcome through requirement, surface, test, and retained proof.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="58" font-size="34" font-weight="800" fill="#17202A">Requirement traceability chain</text><text x="60" y="94" font-size="21" fill="#374151">SP → CN → QT → MH/non-UI → KT → evidence</text><text x="60" y="124" font-size="18" fill="#56616F">Observable outcome through requirement, surface, test, and retained proof.</text><path data-edge-from="trace-observation" data-edge-to="trace-sp" data-route="same-column" d="M 346 246 C 402 246, 402 654, 346 654" fill="none" stroke="#56616F" stroke-width="3" marker-end="url(#arrow)"/>
