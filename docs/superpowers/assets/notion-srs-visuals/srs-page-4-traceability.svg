<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Chuỗi truy vết yêu cầu</title><desc id="diagram-desc">SP → CN → QT → MH/non-UI → KT → bằng chứng. Kết quả quan sát được qua yêu cầu, bề mặt, kiểm thử và bằng chứng được lưu.. Các nút: Kết quả Shopee quan sát được: Chỉ cam kết hành vi bên ngoài; không tuyên bố tương đương nội bộ không quan sát được.; SP — Đối chiếu: Phát biểu kết quả tương đương quan sát được và nguồn tham chiếu.; CN — Năng lực: Yêu cầu năng lực chức năng mang tính chuẩn tắc.; QT — Quy tắc: Quy tắc nghiệp vụ, bất biến và kết quả an toàn.; MH / non-UI — Hợp đồng: Hợp đồng màn hình hoặc ranh giới non-UI được nêu rõ.; KT — Kiểm thử: Kịch bản chấp nhận với kết quả kỳ vọng quan sát được.; Evidence / bằng chứng tự động, thủ công: Test, ảnh chụp, log, build và bằng chứng thực địa đã xác thực.; Cổng field-validation: Bắt buộc cho hành vi nội bộ không quan sát được; chỉ đóng sau xác thực thực địa.; trạng thái Cổng xác thực thực địa. Các quan hệ: L1: ghi nhận quan sát; L2: đặc tả kết quả; L3: ràng buộc quy tắc; ①: biểu đạt hành vi; L4: bao phủ chấp nhận; E1: lưu bằng chứng; E2: nội bộ không quan sát; E3: thực địa đã xác thực.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1400" height="1800" fill="#FFFFFF"/><text x="48" y="56" text-anchor="start" font-size="46" font-weight="800" fill="#26303B">Chuỗi truy vết yêu cầu</text><text x="48" y="94" text-anchor="start" font-size="30" fill="#26303B">SP → CN → QT → MH/non-UI → KT → bằng chứng</text><text x="48" y="128" text-anchor="start" font-size="24" fill="#56616F">Kết quả quan sát được qua yêu cầu, bề mặt, kiểm thử và bằng chứng được lưu.</text><g data-band-index="0"><rect x="48" y="155" width="1304" height="690" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/></g>
<g data-band-index="1"><rect x="48" y="900" width="1304" height="690" rx="20" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="2"/></g><g data-column-index="0" data-column-band="0"><text x="362" y="193" text-anchor="middle" font-size="26" font-weight="700" fill="#26303B">Quan sát &amp; baseline</text></g>
<g data-column-index="1" data-column-band="0"><text x="1038" y="193" text-anchor="middle" font-size="26" font-weight="700" fill="#26303B">Sản phẩm &amp; quy tắc</text></g>
<g data-column-index="2" data-column-band="1"><text x="362" y="938" text-anchor="middle" font-size="26" font-weight="700" fill="#26303B">Bề mặt &amp; kiểm thử</text></g>
<g data-column-index="3" data-column-band="1"><text x="1038" y="938" text-anchor="middle" font-size="26" font-weight="700" fill="#26303B">Bằng chứng &amp; cổng</text></g><path data-edge-from="trace-observation" data-edge-to="trace-sp" data-path-kind="same-column-rail" data-edge-code="L1" data-lane="b0:g:0:1:1" d="M 676 297.01 H 680 V 759.6766666666666 H 676" fill="none" stroke="#56616F" stroke-width="3" marker-end="url(#arrow)"/>
