<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Phân phối ngoài nền tảng &amp; YouTube Shopping</title><desc id="diagram-desc">CN-083–CN-084. Property ngoài nền tảng đã xác minh, hỗ trợ disclosure, OAuth theo phạm vi quyền, đồng bộ catalog/feed, gắn tag ngoài nền tảng, báo cáo, ngắt kết nối và audit sức khỏe.. Các nút: CN-083 Đăng ký property: Đăng ký property/xác minh ghi chủ sở hữu, định danh chuẩn, phương thức và kết quả.; trạng thái Mới; Hỗ trợ disclosure: Hỗ trợ disclosure trình bày hướng dẫn chính sách mà không tự chứng nhận nội dung Creator.; trạng thái Mới; CN-084 Kết nối OAuth: OAuth/phạm vi quyền mở rộng ủy quyền nhà cung cấp bằng quyền tối thiểu và trạng thái thu hồi.; trạng thái Mở rộng; YouTube feed / tag mới: Tích hợp mới chỉ tái sử dụng đọc catalog chuẩn tắc; đồng bộ feed, điều kiện và vòng đời tag ngoài nền tảng thuộc Affiliate.; trạng thái Mới; Báo cáo kênh: Báo cáo lượt nhấp/đơn hàng/thu nhập giữ nguồn ngoài nền tảng và kết quả thương mại chuẩn tắc.; trạng thái Mới; Ngắt kết nối an toàn: Ngắt kết nối/kết nối lại an toàn giữ lịch sử và hiển thị trạng thái sức khỏe có thể xử lý.; trạng thái Mở rộng; Audit kênh: Audit giữ bằng chứng property, phiên bản phạm vi quyền, cursor đồng bộ, tag, báo cáo và tham chiếu ngắt kết nối.; trạng thái Mở rộng. Các quan hệ: L1: property đã xác minh; L2: đã xác nhận chính sách; L3: phạm vi quyền đã cấp; A1: thương mại ngoài nền tảng; ①: thu hồi hoặc hết hạn; E1: bằng chứng báo cáo; E2: bằng chứng ngắt kết nối.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1400" height="1800" fill="#FFFFFF"/><text x="48" y="56" text-anchor="start" font-size="46" font-weight="800" fill="#26303B">Phân phối ngoài nền tảng &amp; YouTube Shopping</text><text x="48" y="94" text-anchor="sta