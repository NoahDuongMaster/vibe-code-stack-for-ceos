<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Dashboard, ưu đãi, hoa hồng &amp; giới thiệu</title><desc id="diagram-desc">CN-010–CN-019. Khám phá ưu đãi có phiên bản, kiểm tra đủ điều kiện, tham gia, tạo tài sản, tổng hợp hiệu suất và khắc phục dữ liệu cũ.. Các nút: CN-010 Truy vấn dashboard: Truy vấn dashboard tái sử dụng tổng hợp người bán, sản phẩm và đơn hàng đã xác thực.; trạng thái Mở rộng; CN-011–015 Ưu đãi: Phiên bản ưu đãi và phiên bản tỷ lệ là bất biến cho mỗi quyết định đủ điều kiện.; trạng thái Mới; Kiểm tra đủ điều kiện: Kiểm tra đủ điều kiện đánh giá phiên bản đã công bố và trả mã kết quả có thể giải thích.; trạng thái Mới; Lời mời / tham gia: Lời mời và việc tham gia liên kết Creator, người bán, phiên bản ưu đãi và trạng thái hiệu lực.; trạng thái Mới; Tài sản Affiliate: Tài sản link/nội dung/giới thiệu giữ lại ngữ cảnh ưu đãi và kênh.; trạng thái Mới; Tổng hợp hiệu suất: Chỉ số tổng hợp lượt nhấp/đơn hàng/thu nhập nêu rõ độ mới và định nghĩa.; trạng thái Mở rộng; Làm mới phiên bản an toàn: Thử lại an toàn làm mới ưu đãi cũ trước khi tham gia hoặc thay đổi tài sản.; trạng thái Mở rộng; Audit / độ mới: Audit lưu watermark truy vấn, phiên bản ưu đãi, cửa sổ tổng hợp và tham chiếu tương quan.; trạng thái Hiện có. Các quan hệ: L1: truy vấn ưu đãi; L2: phiên bản đủ điều kiện; L3: quyết định đủ điều kiện; A1: sự kiện tài sản; A2: lượt nhấp và đơn hàng; ①: phiên bản đã cũ; E1: bằng chứng chỉ số; E2: bằng chứng làm mới.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1400" height="1800" fill="#FFFFFF"/><text x="48" y="56" text-anchor="start" font-size="46" font-weight="800" fill="#26303B">Dashboard, ưu đãi, hoa hồng &amp; giới thiệu</text><text x="48" y="94" text-anchor="start" font-size="30" fill="#26303B">CN-010–CN-019</text><text x="48" y="128" text-anchor="start" font-size="24" fill="#56616F">Khám phá ưu đãi có phiên bản, kiểm tra đủ điều kiện, tham gia, tạo tài sản, tổng hợp hiệu suất và khắc phục dữ liệu cũ.</text><g data-band-index="0"><rect x="48" y="155" width="1304" height="690" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/></g>
