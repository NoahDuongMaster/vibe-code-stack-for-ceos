<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">PPP, cộng tác, hàng mẫu &amp; Seller Affiliate</title><desc id="diagram-desc">CN-057–CN-065. Hợp đồng cộng tác có phiên bản, phí đã cấp vốn, hoàn tất hàng mẫu, nghiệm thu sản phẩm bàn giao, giải ngân, hủy, tranh chấp và bằng chứng.. Các nút: CN-057 Cuộc hội thoại: Cuộc hội thoại mở rộng nhắn tin nội bộ bằng ngữ cảnh cộng tác và tác nhân.; trạng thái Mở rộng; CN-058 Đề xuất: Đề xuất/hợp đồng giữ các bản sửa đổi bất biến, chấp nhận, sản phẩm bàn giao và quyền sử dụng.; trạng thái Mới; CN-060 Phí đã cấp vốn: Phí đã cấp vốn ghi tham chiếu nhà cung cấp và điều kiện giải ngân mà không tuyên bố số dư gộp.; trạng thái Mới; CN-059 Sample / Hàng mẫu: Vận chuyển hàng mẫu PPP mới tái dùng adapter giao hàng/theo dõi; không dùng fulfillment thương mại nếu thiếu ADR.; trạng thái Mới; CN-061 Sản phẩm bàn giao: Sản phẩm bàn giao/xét duyệt tham chiếu phiên bản hợp đồng đã chấp nhận trước khi CN-062 giải ngân.; trạng thái Mới; CN-063–065 Khắc phục: Hủy/tranh chấp an toàn giữ bất biến bằng chứng hợp đồng, phí đã cấp vốn, hàng mẫu và xét duyệt.; trạng thái Mới; Bằng chứng giải ngân: Giải ngân và bằng chứng liên kết việc chấp nhận, số tiền, tham chiếu sổ cái, tác nhân và thời gian.; trạng thái Mở rộng. Các quan hệ: L1: đàm phán; L2: hợp đồng đã chấp nhận; L3: đã xác nhận cấp vốn; ①: hàng mẫu đã giao; L4: giải ngân; ②: hủy hoặc tranh chấp; E1: bằng chứng tài chính; E2: bằng chứng tranh chấp.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1400" height="1800" fill="#FFFFFF"/><text x="48" y="56" text-anchor="start" font-size="46" font-weight="800" fill="#26303B">PPP, cộng tác, hàng mẫu &amp; Seller Affiliate</text><text x="48" y="94" text-anchor="start" font-size="30" fill="#26303B">CN-057–CN-065</text><text x="48" y="128" text-anchor="start" font-size="24" fill="#56616F"><tspan x="48" dy="0">Hợp đồng cộng tác có phiên bản, phí đã cấp vốn, hoàn tất hàng mẫu, nghiệm thu sản phẩm bàn giao, giải ngân, hủy, tranh </tspan><tspan x="48" dy="30">chấp và bằng chứng.</tspan></text><g data-band-index="0"><rect x="48" y="155" width="1304" height="690" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/></g>
