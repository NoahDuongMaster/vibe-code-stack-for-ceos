<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Điều hướng UI Seller PPS &amp; liên hệ Creator</title><desc id="diagram-desc">MH-032–MH-035. Đăng ký Seller PPS và quản lý tỷ lệ, khám phá Creator, chat nội bộ và liên hệ theo phạm vi đồng ý.. Các nút: Điểm vào/xác thực: Điểm vào tuyến đã xác thực, có cổng vai trò và trạng thái tài khoản.; trạng thái Hiện có; Vendor Portal: Các tuyến Seller PPS, tỷ lệ, danh bạ và chat nội bộ.; trạng thái Mở rộng; Storefront: Cài đặt đồng ý liên hệ và tuyến thu hồi của Creator.; trạng thái Mở rộng; MH-032 Đăng ký PPS: Điều kiện, phiên bản điều khoản, trạng thái đăng ký và hành động tiếp theo.; trạng thái Mới; MH-033 Tỷ lệ: Nhắm mục tiêu sản phẩm, giá trị hoa hồng, thời điểm hiệu lực và phiên bản.; trạng thái Mới; MH-034 Danh bạ: Khám phá Creator, hồ sơ an toàn theo đồng ý và hành động chat nội bộ.; trạng thái Mới; MH-035 Đồng ý liên hệ: Phạm vi liên hệ, mục đích, thời hạn, thu hồi và trạng thái hiệu lực.; trạng thái Mới; Kết quả chuẩn tắc BFF/API: Đăng ký PPS, tỷ lệ có hiệu lực, khả năng hiển thị danh bạ và đồng ý liên hệ từ BFF/API.; trạng thái Mở rộng; Đang tải/lỗi/từ chối: Đang tải giữ bộ lọc; lỗi cho phép thử lại; từ chối hoặc thu hồi sẽ gỡ dữ liệu liên hệ được bảo vệ.; Khắc phục / thoát an toàn: Thu hồi đồng ý sẽ ẩn thông tin liên hệ nhưng giữ nguyên chat; thoát an toàn về danh bạ phù hợp đồng ý.; Audit / tham chiếu: Phiên bản điều khoản/tỷ lệ, cấp hoặc thu hồi đồng ý, mục đích disclosure và tham chiếu chat.. Các quan hệ: L1: người bán đã xác thực; L2: tuyến Seller PPS; L3: đã đăng ký → cấu hình; L4: khám phá Creator; ①: chat nội bộ; ②: đồng ý của Creator; L5: cấp / thu hồi; E1: bằng chứng tỷ lệ và đồng ý; L6: đang tải / lỗi / từ chối; L7: thử lại / tác vụ được phép.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1400" height="1800" fill="#FFFFFF"/><text x="48" y="56" text-anchor="start" font-size="46" font-weight="800" fill="#26303B">Điều hướng UI Seller PPS &amp; liên hệ Creator</text><text x="48" y="94" text-anchor="start" font-size="30" fill="#26303B">MH-032–MH-035</text><text x="48" y="128" text-anchor="start" font-size="24" fill="#56616F">Đăng ký Seller PPS và quản lý tỷ lệ, khám phá Creator, chat nội bộ và liên hệ theo phạm vi đồng ý.</text><g data-band-index="0"><rect x="48" y="155" width="1304" height="690" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/></g>
