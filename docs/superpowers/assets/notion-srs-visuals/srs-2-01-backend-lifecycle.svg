<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Vòng đời định danh, onboarding &amp; tài khoản</title><desc id="diagram-desc">CN-001–CN-009. Đơn đăng ký Affiliate, xác minh, xét duyệt, trạng thái tài khoản, khắc phục an toàn và bằng chứng quyết định được lưu giữ.. Các nút: CN-001 Đơn đăng ký: Bản nháp đăng ký được lưu trước khi Creator gửi một bản ghi có phiên bản.; trạng thái Mới; CN-003 Định danh: Trạng thái định danh/liên hệ mở rộng ranh giới tài khoản hiện có mà không lưu dữ liệu thô từ nhà cung cấp.; trạng thái Mở rộng; Quyền sở hữu kênh: Xác minh quyền sở hữu kênh ghi lại phương thức, kết quả và property đã xác minh.; trạng thái Mới; Admin xét duyệt: Admin xét duyệt trả về active, needs_action hoặc rejected cùng mã lý do an toàn.; trạng thái Mở rộng; Tạm ngưng: Tạm ngưng và xác minh lại duy trì độc lập trạng thái tài khoản với trạng thái xác minh.; trạng thái Mới; Xác minh lại an toàn: Khiếu nại hoặc xác minh lại an toàn đưa người dùng về đúng bước bằng chứng được yêu cầu.; trạng thái Mới; CN-004 Cổng parity native: Chỉ đóng parity sau khi ADR được duyệt, có triển khai native và bằng chứng xác thực từ thực địa.; trạng thái Cổng xác thực thực địa; Bằng chứng có phiên bản: Bằng chứng có phiên bản lưu tác nhân, đầu vào, chính sách, kết quả, thời điểm và tham chiếu.; trạng thái Mở rộng. Các quan hệ: L1: đã gửi; L2: đã xác minh; L3: kết quả sở hữu; ①: chuyển trạng thái; ②: cần hành động; E1: bằng chứng quyết định; E2: bằng chứng khắc phục; E3: cổng phát hành.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1400" height="1800" fill="#FFFFFF"/><text x="48" y="56" text-anchor="start" font-size="46" font-weight="800" fill="#26303B">Vòng đời định danh, onboarding &amp; tài khoản</text><text x="48" y="94" text-anchor="start" font-size="30" fill="#26303B">CN-001–CN-009</text><text x="48" y="128" text-anchor="start" font-size="24" fill="#56616F">Đơn đăng ký Affiliate, xác minh, xét duyệt, trạng thái tài khoản, khắc phục an toàn và bằng chứng quyết định được lưu giữ.</text><g data-band-index="0"><rect x="48" y="155" width="1304" height="690" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/></g>
