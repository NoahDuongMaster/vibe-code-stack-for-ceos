<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Gian lận, enforcement &amp; khiếu nại</title><desc id="diagram-desc">CN-078–CN-082. Bằng chứng gian lận quan sát được, phân loại rủi ro, đồ thị thực thể, chính sách qua xác thực thực địa, thực thi, khiếu nại, thu hồi và bằng chứng được bảo toàn.. Các nút: CN-080 Báo cáo: Báo cáo/bằng chứng chỉ nhận dữ kiện trong phạm vi và bảo vệ dữ liệu người báo cáo lẫn đối tượng.; trạng thái Mới; Phân loại rủi ro: Phân loại rủi ro mở rộng xử lý case Admin bằng mức ưu tiên, người phụ trách và SLA.; trạng thái Mở rộng; Đồ thị thực thể: Đồ thị thực thể hiển thị quan hệ được phép và bằng chứng nguồn mà không lộ dữ liệu thô nhạy cảm.; trạng thái Mới; CN-078–079 Chính sách: Chính sách quyết định cần xác thực thực địa; không tuyên bố parity cho ngưỡng hay mô hình không quan sát được.; trạng thái Cổng xác thực thực địa; CN-081 Thực thi: Hành động giữ lại/đảo ngược/thực thi có phạm vi, idempotent, xác nhận và mã lý do.; trạng thái Mới; Khiếu nại thực thi an toàn: Khiếu nại an toàn giữ quyết định ban đầu hiệu lực đến khi có kết quả được cấp quyền.; trạng thái Mới; CN-082 Thu hồi: Thu hồi/gỡ bỏ và bằng chứng được bảo toàn giữ chính sách, tác nhân, phạm vi, thời gian và tham chiếu.; trạng thái Mở rộng. Các quan hệ: L1: mở case điều tra; L2: dữ kiện được phép; L3: case đã phân loại; ①: quyết định đã duyệt; ②: đường khiếu nại; E1: bằng chứng quyết định; E2: bằng chứng hành động; E3: bằng chứng khiếu nại.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1400" height="1800" fill="#FFFFFF"/><text x="48" y="56" text-anchor="start" font-size="46" font-weight="800" fill="#26303B">Gian lận, enforcement &amp; khiếu nại</text><text x="48" y="94" text-anchor="start" font-size="30" fill="#26303B">CN-078–CN