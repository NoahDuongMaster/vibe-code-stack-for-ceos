<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Attribution, snapshot tỷ lệ &amp; sổ cái hoa hồng</title><desc id="diagram-desc">CN-028–CN-039. Chọn ứng viên tất định có thể phát lại, kết quả attribution có phiên bản, snapshot tỷ lệ bất biến, journal theo dòng đơn hàng và khiếu nại an toàn.. Các nút: CN-028 Điểm chạm: Điểm chạm đủ điều kiện trong cửa sổ đã cấu hình tạo thành tập đầu vào hữu hạn.; trạng thái Mới; Tập ứng viên: Tập ứng viên giữ cả ứng viên được chấp nhận và bị loại cùng mã lý do.; trạng thái Mới; CN-031–034 Lớp attribution: Lớp attribution và thứ tự ưu tiên tất định dùng đầu vào quan sát được, có phiên bản và vẫn qua cổng xác thực thực địa.; trạng thái Cổng xác thực thực địa; Kết quả thắng / phiên bản: Kết quả thắng lưu phiên bản chính sách, lý do của ứng viên và kết quả quan sát được theo quy tắc tất định.; trạng thái Mới; CN-029–030 Tỷ lệ: Snapshot tỷ lệ đóng băng sản phẩm đủ điều kiện, người bán, Creator, cơ sở tính và chính sách hiệu lực.; trạng thái Mới; CN-035–039 Sổ cái: Sổ cái/điều chỉnh theo dòng đơn hàng dùng bút toán chỉ-ghi-thêm và tham chiếu cân bằng.; trạng thái Mới; Phát lại bằng chứng an toàn: Khiếu nại an toàn phát lại ứng viên, kết quả thắng, snapshot tỷ lệ và điều chỉnh mà không sửa dữ liệu.; trạng thái Mở rộng; Phát lại bằng chứng: Sự kiện đơn hàng hiện có cùng đầu vào có phiên bản hỗ trợ phát lại bằng chứng theo quy tắc tất định.; trạng thái Hiện có. Các quan hệ: L1: trong cửa sổ; L2: tập đủ điều kiện; L3: kết quả tất định; L4: phiên bản kết quả thắng; ①: snapshot dòng đơn hàng; E1: bằng chứng journal; E2: bằng chứng quyết định; ②: tham chiếu tranh chấp; E3: bằng chứng phát lại.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56616F"/></marker></defs><rect width="1400" height="1800" fill="#FFFFFF"/><text x="48" y="56" text-anchor="start" font-size="46" font-weight="800" fill="#26303B">Attribution, snapshot tỷ lệ &amp; sổ cái hoa hồng</text><text x="48" y="94" text-anchor="start" font-size="30" fill="#26303B">CN-028–CN-039</text><text x="48" y="128" text-anchor="start" font-size="24" fill="#56616F"><tspan x="48" dy="0">Chọn ứng viên tất định có thể phát lại, kết quả attribution có phiên bản, snapshot tỷ lệ bất biến, journal theo dòng đơn hàng </tspan><tspan x="48" dy="30">và khiếu nại an toàn.</tspan></text><g data-band-index="0"><rect x="48" y="155" width="1304" height="690" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/></g>
