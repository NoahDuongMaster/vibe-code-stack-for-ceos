syntax = "proto3";

package auth.v1;

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthUser {
  string id = 1;
  string email = 2;
  string name = 3;
}

message LoginResponse {
  string token = 1;
  AuthUser user = 2;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {}
}
