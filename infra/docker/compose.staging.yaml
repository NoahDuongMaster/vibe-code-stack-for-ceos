services:
  dapp:
    image: vibe-dapp:staging
    build:
      args:
        # NEXT_PUBLIC_* values are inlined at build time. Override every
        # placeholder through the shell/environment used to build this image.
        NEXT_PUBLIC_PROJECT_NAME: ${NEXT_PUBLIC_PROJECT_NAME:-vibe-code-stack-for-ceos}
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:?Set NEXT_PUBLIC_API_ENDPOINT}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?Set NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_CORS_COOKIE: ${NEXT_PUBLIC_CORS_COOKIE:?Set NEXT_PUBLIC_CORS_COOKIE}
    ports:
      - '127.0.0.1:${STAGING_DAPP_HOST_PORT:-46200}:3000'
    # Required runtime secrets live in this git-ignored file. Compose refuses
    # to start if it is missing.
    env_file:
      - ${STAGING_DAPP_ENV_FILE:-../../apps/dapp/.env.staging}

  trading-rpc:
    image: vibe-trading-rpc:staging
    env_file:
      - ${STAGING_TRADING_RPC_ENV_FILE:-../../services/trading-rpc/.env.staging}

  admin-rpc:
    image: vibe-admin-rpc:staging
    env_file:
      - ${STAGING_ADMIN_RPC_ENV_FILE:-../../services/admin-rpc/.env.staging}
    environment:
      TRADING_RPC_GRPC_URL: http://trading-rpc:50051

  postgres:
    environment:
      POSTGRES_BACKUP_MODE: disabled

  postgres-backup:
    environment:
      POSTGRES_BACKUP_MODE: disabled
