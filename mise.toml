min_version = "2026.7.7"

[tools]
actionlint = "1.7.12"
node = "22.23.1"
pnpm = "11.2.2"
shellcheck = "0.11.0"
terraform = "1.15.8"

[settings]
lockfile = true

[tasks.setup]
description = "Install dependencies from the committed pnpm lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start all application workspaces"
depends = ["dev:infra"]
run = "pnpm internal:dev"

[tasks."dev:database"]
description = "Start PostgreSQL for native service development"
run = "make start-postgres-development"

[tasks."dev:infra"]
description = "Start PostgreSQL and the VPC origin for native development"
run = "make start-native-development-infra"

[tasks."dev:infra:stop"]
description = "Stop native-development infrastructure"
run = "make stop-native-development-infra"

[tasks."dev:web"]
description = "Start the dapp"
run = "pnpm internal:dev:web"

[tasks."dev:admin"]
description = "Start the admin SPA"
run = "pnpm internal:dev:admin"

[tasks."dev:landing"]
description = "Start the landing site"
run = "pnpm internal:dev:landing"

[tasks."dev:api"]
description = "Start trading-rpc"
depends = ["dev:database"]
run = "pnpm internal:dev:api"

[tasks."dev:admin-api"]
description = "Start admin-rpc (requires trading-rpc native gRPC on port 46005)"
run = "pnpm internal:dev:admin-api"

[tasks."dev:gateway"]
description = "Start the API gateway"
depends = ["dev:infra"]
run = "pnpm internal:dev:gateway"

[tasks."dev:backend"]
description = "Start the gateway, admin-rpc, and trading-rpc"
depends = ["dev:infra"]
run = "pnpm internal:dev:backend"

[tasks.format]
description = "Format repository files"
run = "pnpm internal:format"

[tasks.check]
description = "Apply Biome fixes and formatting"
run = "pnpm internal:check"

[tasks."check:ci"]
description = "Run the read-only Biome gate"
run = "pnpm internal:check:ci"

[tasks.typecheck]
description = "Run strict TypeScript checks"
run = "pnpm internal:typecheck"

[tasks.lint]
description = "Run lint and architecture checks"
run = "pnpm internal:lint"

[tasks.test]
description = "Run repository unit tests"
run = "pnpm internal:test"

[tasks."test:coverage"]
description = "Enforce frontend feature and entity coverage thresholds"
run = "pnpm internal:test:coverage"

[tasks."test:e2e"]
description = "Run dapp Playwright tests"
run = "pnpm internal:test:e2e"

[tasks."test:e2e:production"]
description = "Build and run dapp E2E tests against the production server"
run = "pnpm internal:test:e2e:production"

[tasks."test:docker"]
description = "Run Docker validation, backup tests, integration restore, and release-image checks"
run = [
  "make check-docker",
  "make test-postgres-backup-scripts",
  "make test-postgres-backup-integration",
  "make test-release-image-dependencies",
]

[tasks."test:protocol"]
description = "Verify protobuf code generation and backward compatibility"
run = "pnpm --filter @packages/protocol generate:check && pnpm --filter @packages/protocol breaking"

[tasks."security:audit"]
description = "Reject high-severity dependency vulnerabilities"
run = "pnpm audit --audit-level=high"

[tasks.build]
description = "Run production builds"
run = "pnpm internal:build"

[tasks."toolchain:check"]
description = "Verify active Node.js and pnpm versions"
run = "node scripts/check-toolchain.ts"

[tasks.verify]
description = "Run every definition-of-done gate sequentially"
run = [
  { task = "typecheck" },
  { task = "check:ci" },
  { task = "lint" },
  { task = "test" },
  { task = "test:coverage" },
  { task = "build" },
  { task = "test:e2e:production" },
  { task = "test:protocol" },
  { task = "security:audit" },
  { task = "test:docker" },
]

[tasks."docker:start"]
description = "Start the full Docker development environment"
run = "make start-development"

[tasks."docker:start:dapp"]
description = "Start the dapp Docker development service and its dependencies"
run = "make start-dapp-development"

[tasks."docker:start:admin"]
description = "Start the admin Docker development service and its dependencies"
run = "make start-admin-development"

[tasks."docker:start:landing"]
description = "Start the landing Docker development service and its dependencies"
run = "make start-landing-development"

[tasks."docker:start:api-gateway"]
description = "Start the API gateway Docker development service and its dependencies"
run = "make start-api-gateway-development"

[tasks."docker:start:trading-rpc"]
description = "Start the trading RPC Docker development service and its dependencies"
run = "make start-trading-rpc-development"

[tasks."docker:start:admin-rpc"]
description = "Start the admin RPC Docker development service and its dependencies"
run = "make start-admin-rpc-development"

[tasks."docker:stop"]
description = "Stop the full Docker development environment"
run = "make stop-development"

[tasks."docker:check"]
description = "Validate Docker definitions"
run = "make check-docker"

[tasks."terraform:check"]
description = "Format-check and validate every Terraform environment"
run = "infra/terraform/check.sh"

[tasks."ops:check"]
description = "Validate GitHub Actions and deployment shell scripts"
run = [
  "actionlint",
  "shellcheck infra/terraform/check.sh infra/terraform/deploy-rpc.sh infra/terraform/modules/rpc-stack/files/deploy.sh infra/terraform/modules/rpc-stack/files/bootstrap.sh.tftpl",
]
