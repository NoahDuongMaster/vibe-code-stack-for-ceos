name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege by default; no job here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Pull Request Scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce reviewable change size
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'large-change-reviewed') }}
        run: >-
          node scripts/check-pr-size.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
        env:
          MAX_PR_CHANGED_FILES: 150
          MAX_PR_CHANGED_LINES: 20000

      - name: Record approved large-change exception
        if: ${{ contains(github.event.pull_request.labels.*.name, 'large-change-reviewed') }}
        run: echo 'Large-change scope was explicitly approved with the large-change-reviewed label.' >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typecheck-

      - name: Type check
        run: mise run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-

      - name: Biome check
        run: mise run check:ci

      - name: ESLint
        run: mise run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-

      - name: Run tests
        run: mise run test

      - name: Enforce coverage thresholds
        run: mise run test:coverage

  e2e:
    name: Dapp E2E Tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_PROJECT_NAME: e2e-build
      NEXT_PUBLIC_API_ENDPOINT: https://placeholder.example.com
      NEXT_PUBLIC_BASE_URL: http://localhost:46000
      SESSION_SECRET: ci-placeholder-secret-32-chars!!
      DEMO_AUTH_EMAIL: e2e@example.com
      DEMO_AUTH_PASSWORD: ci-placeholder-password
      DAPP_LOGIN_RATE_LIMIT_MODE: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          echo "version=$(apps/dapp/node_modules/.bin/playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        run: apps/dapp/node_modules/.bin/playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Chromium OS dependencies
        run: apps/dapp/node_modules/.bin/playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Create runtime environment
        run: |
          cat <<EOF > apps/dapp/.dev.vars
          NEXT_PUBLIC_PROJECT_NAME=${{ env.NEXT_PUBLIC_PROJECT_NAME }}
          NEXT_PUBLIC_API_ENDPOINT=${{ env.NEXT_PUBLIC_API_ENDPOINT }}
          NEXT_PUBLIC_BASE_URL=${{ env.NEXT_PUBLIC_BASE_URL }}
          SESSION_SECRET=${{ env.SESSION_SECRET }}
          DEMO_AUTH_EMAIL=${{ env.DEMO_AUTH_EMAIL }}
          DEMO_AUTH_PASSWORD=${{ env.DEMO_AUTH_PASSWORD }}
          EOF

      - name: Build
        run: pnpm --filter @apps/dapp build

      - name: Run Playwright tests
        run: pnpm --filter @apps/dapp test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/dapp/playwright-report/
            apps/dapp/e2e-results/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  docker:
    name: Docker Images & PostgreSQL Recovery
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate and test release containers
        run: mise run test:docker

  protocol:
    name: Protobuf Lint, Codegen Drift & Breaking-Change Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `buf breaking` diffs against main, so it needs real history —
          # the default shallow (depth-1) checkout only has this one commit.
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      # Hard gate: the proto schema itself must always pass STANDARD lint.
      - name: buf lint
        run: pnpm --filter @packages/protocol lint

      # Hard gate: packages/protocol/src/gen is committed, generated code —
      # this catches a proto edited without regenerating (`pnpm --filter
      # @packages/protocol generate`) before the PR merges.
      - name: buf generate (codegen drift check)
        run: pnpm --filter @packages/protocol generate:check

      # Pull-request checkouts are detached and expose origin/main without a
      # local main ref. Buf clones the local repository declared by the package
      # script, so materialize that baseline explicitly before the comparison.
      - name: Prepare main protobuf baseline
        run: |
          git fetch --no-tags origin main
          git update-ref refs/heads/main FETCH_HEAD

      # Hard gate: published protobuf contracts stay backward compatible with
      # main. Intentional breaking changes require an explicit versioned API.
      - name: buf breaking (against main)
        run: pnpm --filter @packages/protocol breaking

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Build
        run: mise run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_PROJECT_NAME: ci-build
          NEXT_PUBLIC_API_ENDPOINT: https://placeholder.example.com
          NEXT_PUBLIC_BASE_URL: https://placeholder.example.com
          SESSION_SECRET: ci-placeholder-secret-32-chars!!
          DEMO_AUTH_EMAIL: ci@example.com
          DEMO_AUTH_PASSWORD: ci-placeholder-password
