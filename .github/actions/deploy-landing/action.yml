name: Deploy landing
description: Build, deploy, and smoke-test the Astro landing Worker

inputs:
  environment:
    description: Wrangler environment to deploy
    required: true
  public-site-url:
    description: Canonical public HTTPS origin
    required: true
  public-sentry-dsn:
    description: Optional public Sentry DSN used during the build
    required: false
    default: ''
  smoke:
    description: Run the landing-only smoke test after deployment
    required: false
    default: 'true'
  rollback-on-failure:
    description: Restore the captured Worker version when this action fails
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Validate landing deployment values
      shell: bash
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        PUBLIC_SITE_URL: ${{ inputs.public-site-url }}
      run: |
        required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUBLIC_SITE_URL)
        missing=false
        for name in "${required[@]}"; do
          if [[ -z "${!name:-}" ]]; then
            echo "::error::Missing required $DEPLOY_ENVIRONMENT value: ${name}"
            missing=true
          fi
        done
        if [[ "$missing" == true ]]; then
          echo "Configure the $DEPLOY_ENVIRONMENT GitHub Environment values documented in docs/setup-and-deployment.md."
          exit 1
        fi
        node <<'NODE'
        const value = process.env.PUBLIC_SITE_URL ?? '';
        const url = new URL(value);
        const normalized = value.endsWith('/') ? value.slice(0, -1) : value;
        if (
          url.protocol !== 'https:' ||
          !url.hostname.includes('.') ||
          url.origin !== normalized
        ) {
          throw new Error('PUBLIC_SITE_URL must be a public HTTPS origin without a path, query, or fragment.');
        }
        NODE

    - name: Build landing
      shell: bash
      env:
        PUBLIC_SITE_URL: ${{ inputs.public-site-url }}
        PUBLIC_SENTRY_DSN: ${{ inputs.public-sentry-dsn }}
      run: pnpm --filter @apps/landing build

    - name: Capture current landing deployment
      shell: bash
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if deployments=$(pnpm --filter @apps/landing exec wrangler deployments list --env "$DEPLOY_ENVIRONMENT" --json 2>/dev/null); then
          previous=$(jq -r 'last as $deployment | [$deployment.versions[]? | select(.percentage == 100) | .version_id][0] // empty' <<<"$deployments")
          if [[ -n "$previous" ]]; then
            echo "PREVIOUS_LANDING_VERSION_ID=$previous" >> "$GITHUB_ENV"
          else
            echo "::notice::No previous $DEPLOY_ENVIRONMENT landing version; automatic rollback is unavailable for the first release."
          fi
        else
          echo "::notice::No previous $DEPLOY_ENVIRONMENT landing deployment; automatic rollback is unavailable for the first release."
        fi

    - name: Deploy landing
      shell: bash
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        output_file="$RUNNER_TEMP/landing-$DEPLOY_ENVIRONMENT-deploy.ndjson"
        WRANGLER_OUTPUT_FILE_PATH="$output_file" pnpm --filter @apps/landing exec wrangler deploy --env "$DEPLOY_ENVIRONMENT" --strict
        echo 'LANDING_DEPLOYED=true' >> "$GITHUB_ENV"
        deployment_url=$(jq -r 'select(.type == "deploy") | .targets[0] // empty' "$output_file" | tail -n 1)
        if [[ -z "$deployment_url" ]]; then
          echo "::error::Wrangler did not report the $DEPLOY_ENVIRONMENT landing deployment URL."
          exit 1
        fi
        echo "LANDING_DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"

    - name: Smoke-test landing
      if: inputs.smoke == 'true'
      shell: bash
      env:
        PUBLIC_SITE_URL: ${{ inputs.public-site-url }}
      run: |
        for url in "$LANDING_DEPLOYMENT_URL" "$PUBLIC_SITE_URL"; do
          echo "Smoke-testing ${url%/}/"
          curl --fail --silent --show-error --location \
            --retry 24 --retry-delay 5 --retry-all-errors \
            "${url%/}/" >/dev/null
        done
        landing_origin="${PUBLIC_SITE_URL%/}"
        homepage=$(curl --fail --silent --show-error --location "$landing_origin/")
        if [[ "$homepage" != *"<link rel=\"canonical\" href=\"$landing_origin/\">"* ]]; then
          echo "::error::Landing canonical URL does not match PUBLIC_SITE_URL."
          exit 1
        fi
        robots=$(curl --fail --silent --show-error --location "$landing_origin/robots.txt")
        if ! grep -Fqx "Sitemap: $landing_origin/sitemap-index.xml" <<<"$robots"; then
          echo "::error::Landing robots.txt does not advertise the expected sitemap."
          exit 1
        fi

    - name: Roll back landing after a failed release
      if: failure() && inputs.rollback-on-failure == 'true' && env.LANDING_DEPLOYED == 'true' && env.PREVIOUS_LANDING_VERSION_ID != ''
      continue-on-error: true
      shell: bash
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      run: >-
        pnpm --filter @apps/landing exec wrangler rollback
        "$PREVIOUS_LANDING_VERSION_ID" --env "$DEPLOY_ENVIRONMENT"
        --message "Automatic rollback after failed release"
