name: Setup mise project
description: Install the locked project tools, restore the pnpm store, and install dependencies

runs:
  using: composite
  steps:
    - name: Install mise toolchain
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
      with:
        version: 2026.7.7
        install_args: --locked
        cache: true

    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: mise run setup

    - name: Verify toolchain contract
      shell: bash
      run: mise run toolchain:check
